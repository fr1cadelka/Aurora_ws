ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    # Настройка для GPS
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Входные топики
    odom0: /gps/fix
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,  # X, Y, Z
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Выходные топики
    odom_frame: odom
    base_link_frame: base_link
    map_frame: map

    # Настройка для RTK
    use_control: false
    use_odom: false
    use_imu: false
    use_gps: true
